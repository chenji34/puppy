{% extends 'base.html' %}{% block content %}<section class="page-hero"><span class="eyebrow">公立收容所公開資訊</span><h1>幫浪浪找家 🐕</h1><p>可以先收藏喜歡的浪浪，再把資訊卡帶回家和爸媽討論。聯絡收容所請由家長協助。</p></section>
<section class="max-w-6xl mx-auto px-4 pb-12"><div class="filter-box"><div><label class="filter-label">想看看誰？</label><div class="segmented"><button class="filter-chip active" data-kind="">全部</button><button class="filter-chip" data-kind="狗">狗狗 🐶</button><button class="filter-chip" data-kind="貓">貓貓 🐱</button></div></div><div><label class="filter-label" for="area-filter">選擇縣市</label><select id="area-filter" class="filter-select"><option value="">全台灣</option>{% for id, name in areas.items() %}<option value="{{ id }}">{{ name }}</option>{% endfor %}</select></div><div><label class="filter-label" for="body-filter">體型大小</label><select id="body-filter" class="filter-select"><option value="">全部體型</option><option value="SMALL">嬌小迷你型</option><option value="MEDIUM">剛剛好中型</option><option value="BIG">大塊頭大型</option></select></div><button id="search-animals" class="button-primary">🔎 找浪浪</button></div>
<div id="animal-status" class="status-box" role="status">正在邀請浪浪來見面…</div><div id="animal-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5 mt-5"></div><div class="flex justify-center gap-3 mt-8"><button id="prev-page" class="button-secondary" disabled>← 上一頁</button><span id="page-label" class="page-label">第 1 頁</span><button id="next-page" class="button-secondary">下一頁 →</button></div><p class="source-note">資料來源：農業部動物認領養開放資料。資料每日更新，認養狀態、聯絡方式與流程請由家長向收容所確認。</p></section>
<div id="adopt-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="adopt-title"><div class="modal-card adopt-note"><button class="modal-close" data-close-modal aria-label="關閉">×</button><div class="certificate-stamp">🐾</div><span class="eyebrow">帶回家和家人討論</span><h2 id="adopt-title" class="text-2xl font-black mt-2">給爸媽看的領養小卡</h2><div id="adopt-details" class="adopt-details"></div><p class="parent-note">孩子請和家長一起閱讀，由家長聯絡收容所確認最新資訊及認養條件。</p><button id="copy-adopt" class="button-primary w-full mt-4">📋 複製資訊傳給爸媽</button></div></div>{% endblock %}{% block scripts %}<script src="{{ url_for('static', filename='js/adopt.js') }}" defer></script>{% endblock %}

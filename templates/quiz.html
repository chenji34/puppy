{% extends 'base.html' %}{% block content %}<section class="page-hero"><span class="eyebrow">小小守護者闖關挑戰</span><h1>答題集徽章，成為守護者！ ✨</h1><p>共 {{ questions|length }} 道生活情境題，答對 80 分以上可以製作專屬證書。</p></section>
<section class="max-w-3xl mx-auto px-4 pb-14"><div id="quiz-app" class="quiz-card" data-questions='{{ questions|tojson|forceescape }}'><div class="quiz-top"><span id="quiz-progress">第 1 / {{ questions|length }} 題</span><div class="progress-track"><div id="progress-fill"></div></div><span id="quiz-score">⭐ 0</span></div><h2 id="question-text" class="question-text"></h2><div id="options-list" class="options-list"></div><div id="answer-feedback" class="answer-feedback hidden" aria-live="polite"></div><button id="next-question" class="button-primary mt-5 hidden">下一題 →</button></div><div id="quiz-result" class="quiz-result hidden"></div><p class="text-center text-slate-500 mt-5">闖關徽章只會保存在這台裝置的瀏覽器中，不需註冊。</p></section>{% endblock %}{% block scripts %}<script src="{{ url_for('static', filename='js/quiz.js') }}" defer></script>{% endblock %}
